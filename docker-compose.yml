version: '3.8'

services:
  analysis-backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: football-analysis-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    volumes:
      - ./data:/app/data
    restart: unless-stopped
